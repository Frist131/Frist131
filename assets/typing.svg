<svg xmlns="http://www.w3.org/2000/svg" width="700" height="60" viewBox="0 0 700 60">
  <defs>
    <clipPath id="reveal">
      <rect x="112" y="0" height="60" width="0">
        <animate attributeName="width"
                 values="0;476;476;0;0"
                 keyTimes="0;0.2353;0.8235;0.9412;1"
                 dur="17s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <text x="112" y="35" fill="#00F7A5" font-family="'Fira Code', monospace" font-size="22"
        textLength="476" lengthAdjust="spacingAndGlyphs" clip-path="url(#reveal)">Zyren Kazuhira | Security Researcher</text>

  <rect y="40" width="13" height="3" fill="#A0A0A0">
    <animate attributeName="x"
             values="112;588;588;112;112"
             keyTimes="0;0.2353;0.8235;0.9412;1"
             dur="17s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" calcMode="discrete" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
