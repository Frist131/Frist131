
name: Generate Pacman

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate Pacman
        run: |
          mkdir -p output

          cat > output/pacman.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#050816"/>
                <stop offset="100%" stop-color="#111827"/>
              </linearGradient>
              <filter id="glow">
                <feGaussianBlur stdDeviation="4" result="b"/>
                <feMerge>
                  <feMergeNode in="b"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <rect width="900" height="220" rx="16" fill="url(#bg)"/>
            <rect x="1" y="1" width="898" height="218" rx="16"
              fill="none" stroke="#00f7ff" opacity=".4"/>

            <text x="28" y="35" fill="#00f7ff"
              font-family="monospace" font-size="13"
              letter-spacing="3">PACMAN.EXE</text>

            <text x="872" y="35" text-anchor="end"
              fill="#64748b" font-family="monospace"
              font-size="11">CYBER HUNT</text>

            <path d="M30 65 H870 M30 175 H870"
              stroke="#164e63" stroke-width="2" opacity=".6"/>

            <g fill="#67e8f9">
              <circle cx="90" cy="120" r="3"/>
              <circle cx="145" cy="120" r="3"/>
              <circle cx="200" cy="120" r="3"/>
              <circle cx="255" cy="120" r="3"/>
              <circle cx="310" cy="120" r="3"/>
              <circle cx="365" cy="120" r="3"/>
              <circle cx="420" cy="120" r="3"/>
              <circle cx="475" cy="120" r="3"/>
              <circle cx="530" cy="120" r="3"/>
              <circle cx="585" cy="120" r="3"/>
              <circle cx="640" cy="120" r="3"/>
              <circle cx="695" cy="120" r="3"/>
              <circle cx="750" cy="120" r="3"/>
              <circle cx="805" cy="120" r="3"/>
            </g>

            <!-- Pacman -->
            <g filter="url(#glow)">
              <animateMotion dur="8s" repeatCount="indefinite"
                path="M90 120 H805"
                keyPoints="0;1;0" keyTimes="0;.5;1"
                calcMode="linear"/>
              <path fill="#ffe600"
                d="M0 0 L-23 -17 A28 28 0 1 0 -23 17 Z">
                <animate attributeName="d"
                  values="M0 0 L-23 -17 A28 28 0 1 0 -23 17 Z;
                          M0 0 L-8 -5 A28 28 0 1 0 -8 5 Z;
                          M0 0 L-23 -17 A28 28 0 1 0 -23 17 Z"
                  dur=".32s" repeatCount="indefinite"/>
              </path>
            </g>

            <!-- Ghost cyan -->
            <g filter="url(#glow)">
              <animateMotion dur="8s" repeatCount="indefinite"
                path="M145 120 H805"
                keyPoints="0;1;0" keyTimes="0;.5;1"
                calcMode="linear"/>
              <path fill="#00f7ff"
                d="M-15 15 V-5 A15 15 0 0 1 15 -5 V15
                   L8 9 L0 15 L-8 9 Z"/>
              <circle cx="-5" cy="-3" r="4" fill="white"/>
              <circle cx="5" cy="-3" r="4" fill="white"/>
              <circle cx="-5" cy="-3" r="2" fill="#111827"/>
              <circle cx="5" cy="-3" r="2" fill="#111827"/>
            </g>

            <!-- Ghost violet -->
            <g filter="url(#glow)">
              <animateMotion dur="8s" repeatCount="indefinite"
                path="M255 120 H805"
                keyPoints="0;1;0" keyTimes="0;.5;1"
                calcMode="linear"/>
              <path fill="#a855f7"
                d="M-15 15 V-5 A15 15 0 0 1 15 -5 V15
                   L8 9 L0 15 L-8 9 Z"/>
              <circle cx="-5" cy="-3" r="4" fill="white"/>
              <circle cx="5" cy="-3" r="4" fill="white"/>
              <circle cx="-5" cy="-3" r="2" fill="#111827"/>
              <circle cx="5" cy="-3" r="2" fill="#111827"/>
            </g>

            <!-- Ghost pink -->
            <g filter="url(#glow)">
              <animateMotion dur="8s" repeatCount="indefinite"
                path="M365 120 H805"
                keyPoints="0;1;0" keyTimes="0;.5;1"
                calcMode="linear"/>
              <path fill="#f472b6"
                d="M-15 15 V-5 A15 15 0 0 1 15 -5 V15
                   L8 9 L0 15 L-8 9 Z"/>
              <circle cx="-5" cy="-3" r="4" fill="white"/>
              <circle cx="5" cy="-3" r="4" fill="white"/>
              <circle cx="-5" cy="-3" r="2" fill="#111827"/>
              <circle cx="5" cy="-3" r="2" fill="#111827"/>
            </g>

            <!-- Ghost red -->
            <g filter="url(#glow)">
              <animateMotion dur="8s" repeatCount="indefinite"
                path="M475 120 H805"
                keyPoints="0;1;0" keyTimes="0;.5;1"
                calcMode="linear"/>
              <path fill="#fb7185"
                d="M-15 15 V-5 A15 15 0 0 1 15 -5 V15
                   L8 9 L0 15 L-8 9 Z"/>
              <circle cx="-5" cy="-3" r="4" fill="white"/>
              <circle cx="5" cy="-3" r="4" fill="white"/>
              <circle cx="-5" cy="-3" r="2" fill="#111827"/>
              <circle cx="5" cy="-3" r="2" fill="#111827"/>
            </g>

            <text x="28" y="202" fill="#64748b"
              font-family="monospace" font-size="10">
              [ CYBER HUNT ] [ NEON MODE ]
            </text>

            <text x="872" y="202" text-anchor="end"
              fill="#00f7ff" font-family="monospace"
              font-size="10">SYSTEM ACTIVE</text>
          </svg>
          SVG

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/pacman.svg

          if ! git diff --cached --quiet; then
            git commit -m "Update cyber pacman"
            git push origin main
          fi
          
